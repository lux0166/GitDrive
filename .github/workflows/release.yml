name: Release & Distribute Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-windows-desktop-app:
    name: Build Native Windows Desktop Application (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Native Desktop App & Installers
        run: npm run electron:build

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-binaries
          path: |
            dist-electron/*.exe
          retention-days: 1

  package-and-publish:
    name: Package Archives & Publish GitHub Release
    needs: build-windows-desktop-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime (v22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Client & Server
        run: npm run build

      - name: Download Windows Desktop Binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-binaries
          path: dist-electron-bin

      - name: Prepare Release Distribution Bundle
        id: package
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            VERSION="${{ github.event.inputs.version || 'v0.2.0' }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Rename and stage native Windows Desktop binaries
          SETUP_EXE=$(find dist-electron-bin -type f -name "*Setup*.exe" | head -n 1)
          PORTABLE_EXE=$(find dist-electron-bin -type f -name "*.exe" ! -name "*Setup*" ! -name "*__uninstaller*" | head -n 1)
          
          if [ -f "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" "GitDrive-Setup-${VERSION}.exe"
          fi
          
          if [ -f "$PORTABLE_EXE" ]; then
            cp "$PORTABLE_EXE" "GitDrive-Portable-${VERSION}.exe"
          fi
          
          # Create archive directory
          RELEASE_DIR="gitdrive-${VERSION}"
          mkdir -p "${RELEASE_DIR}"
          
          cp -r server/dist "${RELEASE_DIR}/server"
          cp -r client/dist "${RELEASE_DIR}/client"
          cp package.json package-lock.json "${RELEASE_DIR}/"
          cp HOW_TO_USE.md README.md "${RELEASE_DIR}/"
          
          tar -czf "gitdrive-${VERSION}-linux-x64.tar.gz" -C "${RELEASE_DIR}" .
          zip -r "gitdrive-${VERSION}-win-x64.zip" "${RELEASE_DIR}"
          
          # Calculate SHA-256 Checksums for all assets
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f \( -name "GitDrive-*.exe" -o -name "gitdrive-*.tar.gz" -o -name "gitdrive-*.zip" \) -exec sha256sum {} + > SHA256SUMS.txt
          
          echo "Created distribution assets with SHA-256 hashes:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GitDrive Release ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            GitDrive-Setup-${{ env.VERSION }}.exe
            GitDrive-Portable-${{ env.VERSION }}.exe
            gitdrive-${{ env.VERSION }}-linux-x64.tar.gz
            gitdrive-${{ env.VERSION }}-win-x64.zip
            SHA256SUMS.txt
          body: |
            ## GitDrive — Native Desktop Platform (${{ env.VERSION }})

            ### 🚀 Native Desktop Highlights
            - **Native Windows Desktop Window**: Dedicated Electron desktop window (dark mode `#09090b`), no external browser tabs needed.
            - **Windows Installer (`GitDrive-Setup-*.exe`)**: Full NSIS installer with Desktop and Start Menu integration.
            - **Portable Executable (`GitDrive-Portable-*.exe`)**: 1-Click portable executable requiring zero installation.
            - **Local-First Git & CI/CD Engine**: Background Express control plane & 8-stage automated delivery pipeline.
            - **Air-Gapped & Cryptographic Provenance**: SHA-256 integrity verification, zero external telemetry.

            ### 📦 Cryptographic Integrity & Checksums
            Verify package authenticity prior to running in air-gapped environments:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
